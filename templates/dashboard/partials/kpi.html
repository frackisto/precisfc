{% comment %}
Indicateur : ``label``, ``value`` (déjà formatée), ``hint`` et ``url`` facultatifs,
``tone`` = « warning » quand une action est attendue.
{% endcomment %}
<div class="col">
  <div class="card h-100 kpi{% if tone %} kpi-{{ tone }}{% endif %}">
    <div class="card-body">
      <p class="kpi-label mb-1">{{ label }}</p>
      <p class="kpi-value mb-0">{% if url %}<a class="stretched-link text-reset text-decoration-none" href="{{ url }}">{{ value }}</a>{% else %}{{ value }}{% endif %}</p>
      {% if hint %}<p class="kpi-hint small text-body-secondary mb-0 mt-1">{{ hint }}</p>{% endif %}
    </div>
  </div>
</div>
