{% extends "base.html" %}
{% block title %}{{ error_title }} — {{ club.name }}{% endblock title %}
{% block content %}
  <div class="text-center py-5">
    <p class="error-code" aria-hidden="true">{{ error_code }}</p>
    <h1 class="h2 mb-3">{{ error_title }}</h1>
    <p class="lead mb-4">{% block error_message %}{% endblock error_message %}</p>
    <a class="btn btn-primary" href="{% url 'core:home' %}"><i class="bi bi-house-door me-1" aria-hidden="true"></i>Retour à l'accueil</a>
  </div>
{% endblock content %}
