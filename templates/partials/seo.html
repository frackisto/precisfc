{# Métadonnées de la page (objet « seo », voir apps/core/seo.py). #}
<meta name="description" content="{{ seo.description }}">
{% if seo.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<link rel="canonical" href="{{ seo.canonical_url }}">
<meta property="og:site_name" content="{{ club.name }}">
<meta property="og:locale" content="fr_CI">
<meta property="og:type" content="{{ seo.type }}">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:url" content="{{ seo.canonical_url }}">
{% if seo.image_url %}<meta property="og:image" content="{{ seo.image_url }}">{% endif %}
<meta name="twitter:card" content="{% if seo.image_url %}summary_large_image{% else %}summary{% endif %}">
